<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information:</legend>
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" value="john" readonly>
            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" disabled>
            <label for="email">Email:</label><br>
            <input type="email" id="email" required>
            <label for="password">Password</label><br>
            <input type="password" id="password" name="password" size="40" placeholder="password"><br>
            <label>gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br>
            <label>hobbies:</label><br>
            <input type="checkbox" id="football" name="football" value="football">
            <label for="football">football</label><br>
            <label for="pets">choose a pet:</label><br>
            <select name="pet" id="pet">
                <option value="dog">dog</option>
                <option value="cat">cat</option>
                <option value="parrot">parrot</option>
            </select><br><br>

            
        </fieldset>
    </form>
</body>
</html>
